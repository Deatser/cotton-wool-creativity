<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игрушка — cotton wool creativity</title>
<meta name="description" content="Ватная ёлочная игрушка ручной работы.">
<link rel="icon" href="../img/logo.png">
<link rel="canonical" href="https://cotton-wool-creativity.ru/tovar/">
<meta property="og:type" content="website">
<meta property="og:title" content="Игрушка — cotton wool creativity">
<meta property="og:description" content="Ватная ёлочная игрушка ручной работы.">
<meta property="og:image" content="../img/hero.jpg">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-root="../">

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../">
      <img class="brand__logo" src="../img/logo.png" width="34" height="34" alt="">
      <span class="brand__name">cotton wool creativity</span>
    </a>

    <button class="burger" type="button" aria-expanded="false" aria-controls="nav" aria-label="Меню">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="nav">
      <div class="nav__item nav__item--drop">
        <a class="nav__link" href="../">
          Главная страница
          <svg class="nav__chev" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </a>
        <div class="nav__drop"><ul class="nav__drop-list" data-toy-list></ul></div>
      </div>

      <a class="nav__link" href="../#in_stock">Игрушки в наличии</a>
      <a class="nav__link" href="../#repeat">Реализованные игрушки</a>
      <a class="nav__link" href="../#custom">Игрушки под заказ</a>
      <a class="nav__link" href="../oplata/">Оплата</a>
    </nav>

    <button class="search-toggle" type="button" aria-expanded="false" aria-controls="search" aria-label="Поиск по сайту">
      <svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M13 13l5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="search" id="search" hidden>
    <div class="search__inner">
      <div class="search__box">
        <svg class="search__icon" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M13 13l5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <input class="search__input" type="search" placeholder="Найти игрушку" autocomplete="off"
               aria-label="Поиск по каталогу">
        <button class="search__clear" type="button" aria-label="Очистить">&times;</button>
      </div>
      <div class="search__results" role="listbox" hidden></div>
    </div>
  </div>
</header>

<main class="toy" data-item-page>
  <div class="wrap">
    <p class="crumbs">
      <a href="../">Главная страница</a> / <span data-item-name>Игрушка</span>
    </p>

    <div class="toy__layout">
      <div class="gallery" data-item-gallery></div>

      <aside class="toy__info">
        <h1 data-item-title>Загружаем...</h1>
        <p class="toy__meta" data-item-size hidden></p>
        <p class="toy__note" data-item-note hidden></p>
        <p class="toy__price" data-item-price hidden></p>
        <p class="toy__status" data-item-status></p>
        <a class="btn" href="../oplata/" data-item-buy hidden>Купить</a>
      </aside>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>cotton wool creativity — ватные авторские игрушки ручной работы</span>
    <a href="../oplata/">Как оплатить и получить</a>
  </div>
</footer>

<script src="../assets/js/catalog.js"></script>
<script src="../assets/js/main.js" defer></script>
<script type="module" src="../assets/js/admin.js"></script>
</body>
</html>
